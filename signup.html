<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — AyurAstro360°</title>
  <meta name="description" content="Join AyurAstro360° and discover your personalised Ayurveda & Vedic Astrology profile." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      border: 1.5px solid rgba(30,92,46,0.2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 500;
      transition: background var(--transition), border-color var(--transition);
      cursor: pointer;
    }
    .social-btn:hover { background: rgba(30,92,46,0.06); border-color: var(--green-mid); }
    .social-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .terms { font-size: 12px; color: var(--text-light); text-align: center; margin-top: 12px; }
    .terms a { color: var(--green-mid); }
    .auth-ring {
      position: absolute;
      width: 340px; height: 340px;
      border: 1px solid rgba(200,125,47,0.12);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      animation: spin 40s linear infinite;
    }
    .auth-ring-2 {
      width: 520px; height: 520px;
      animation-duration: 60s;
      animation-direction: reverse;
      border-color: rgba(45,122,62,0.08);
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-ring"></div>
    <div class="auth-ring auth-ring-2"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <img src="main_logo_nobg.png" alt="AyurAstro360 Logo" />
        <div class="auth-logo-text">ayurastro<span>360°</span></div>
      </div>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Begin your holistic wellness journey</p>

      <form id="signupForm" novalidate>
        <div class="name-row">
          <div class="form-group">
            <label class="form-label" for="signupFirstName">First name</label>
            <input class="form-input" type="text" id="signupFirstName" placeholder="Aarav" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="signupLastName">Last name</label>
            <input class="form-input" type="text" id="signupLastName" placeholder="Sharma" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email address</label>
          <input class="form-input" type="email" id="signupEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <input class="form-input" type="password" id="signupPassword" placeholder="Min. 8 characters" required minlength="8" />
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit" id="signupBtn" style="margin-top:4px;">
          Create Account
        </button>
        <p class="terms">By signing up you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></p>
      </form>

      <div class="auth-divider">or</div>
      <button class="social-btn" id="googleSignupBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-feedback" id="signupFeedback"></div>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
